<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordatorio | Hidrorey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #0b1f2a;
            --deep: #0f3c4c;
            --mist: #e8f2f4;
            --sea: #2da7a1;
            --sun: #f2c14e;
            --paper: #ffffff;
            --shadow: 0 30px 60px rgba(10, 27, 34, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 20%, rgba(45, 167, 161, 0.18), transparent 48%),
                radial-gradient(circle at 90% 10%, rgba(242, 193, 78, 0.2), transparent 45%),
                linear-gradient(120deg, #f9fbfc 0%, #eef6f7 60%, #e7f1f2 100%);
            min-height: 100vh;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 36px 24px 72px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 48px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            border-radius: 16px 6px 16px 6px;
            background: linear-gradient(135deg, var(--deep), var(--sea));
            display: grid;
            place-items: center;
            color: white;
            font-size: 20px;
        }

        .status-chip {
            background: rgba(15, 60, 76, 0.12);
            color: var(--deep);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 36px;
        }

        .hero h1 {
            font-family: "Fraunces", "Times New Roman", serif;
            font-weight: 700;
            font-size: clamp(32px, 4vw, 44px);
            line-height: 1.1;
            margin: 0 0 20px;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.7;
            margin: 0 0 22px;
        }

        .highlight {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--mist);
            color: var(--deep);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
        }

        .quote-card {
            background: var(--paper);
            padding: 28px;
            border-radius: 26px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .quote-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(45, 167, 161, 0.18), transparent 55%);
            pointer-events: none;
        }

        .quote-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 12px;
        }

        .quote-title {
            font-size: 18px;
            font-weight: 700;
        }

        .response-message {
            margin: 16px 0 0;
            padding: 16px;
            border-radius: 16px;
            background: rgba(45, 167, 161, 0.12);
            color: var(--deep);
            font-size: 15px;
            line-height: 1.6;
        }

        .support {
            margin-top: 24px;
            background: rgba(45, 167, 161, 0.12);
            border-radius: 16px;
            padding: 16px;
            font-size: 14px;
            color: var(--deep);
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(11, 31, 42, 0.6);
        }

        .fade-up {
            opacity: 0;
            transform: translateY(14px);
            animation: fadeUp 0.8s ease forwards;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }

        .delay-4 {
            animation-delay: 0.4s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 28px 18px 56px;
            }

            .quote-card {
                padding: 22px;
            }

            .actions .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="topbar fade-up">
            <div class="brand">
                <div class="brand-mark">H</div>
                Hidrorey
            </div>
            <div class="status-chip">Seguimiento pendiente</div>
        </div>

        <section class="grid">
            <div class="hero">
                <div class="highlight fade-up delay-1">
                    Seguimos listos para ayudarte
                </div>
                <h1 class="fade-up delay-2">Hola! Espera una respuesta pronto!
                </h1>
                <p class="fade-up delay-3">
                    Recibiste un recordatorio sobre tu cotización pendiente. Este espacio confirma la
                    respuesta que elegiste en el correo.
                </p>
                <div class="footer fade-up delay-4">
                    Si algo cambió o necesitas apoyo adicional, puedes responder al mismo correo.
                </div>
            </div>
        </section>
    </main>

    <script>
        const setText = (id, value) => {
            const node = document.getElementById(id);
            if (node && value !== undefined && value !== null) {
                node.textContent = value;
            }
        };

        const API_GATEWAY_URL = "https://your-api-gateway-url.execute-api.region.amazonaws.com";

        const postResponse = ({ email_transaction_id, response, prospect_id }) => {
            fetch(`${API_GATEWAY_URL}/response`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ email_transaction_id, response, prospect_id }),
                keepalive: true,
            }).catch(() => {
                // Best-effort tracking; no UI changes needed.
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const transactionId = params.get("transaction_id") || "";
            const response = params.get("response") || "";
            const prospectId = params.get("prospect_id") || "";
            const responseMessage = document.getElementById("response-message");

            if (transactionId) {
                setText("quote-id", transactionId);
            }

            if (responseMessage) {
                const messageMap = {
                    buy: "Gracias por confirmar tu interés en continuar. Ya estamos gestionando el siguiente paso.",
                    more_info: "Gracias por pedir más información. Un asesor te contactará con los detalles.",
                    not_interested: "Gracias por avisarnos. Cerraremos el seguimiento asociado a tu recordatorio.",
                };
                responseMessage.textContent =
                    messageMap[response] ||
                    "Recibimos tu respuesta. En breve te confirmaremos los siguientes pasos.";
            }

            postResponse({
                email_transaction_id: transactionId,
                response,

            });
        });
    </script>
</body>

</html>
